[package]
name = "csvsum"
version = "0.1.0"
edition = "2021"
description = "A fast CLI for exploratory summaries of CSV files"
authors = ["alfredodeza@gmail.com"]
license = "MIT"

[[bin]]
name = "csvsum"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet"] }
serde_yaml = "0.9.34"

[profile.release]
opt-level = 3
lto = true
